main:
  file_game: game1.mp4
  # New design pattern = Abstract factory that allows to choose which models, sources and audience to use for each step.
  # NOTE: [] = empty = 'none' = skips; fallback = triggers fallback; [data] = triggers each entity named data
  workflow:
    get-genre:
      models: fallback
      sources: none
      player: none
    get-games:
      models: none
      sources: ['metacritic']
      player: none
    get-reviews:
      models: none
      sources: ['metacritic']
      player: none
    do-sentiment-analysis:
      models: ['cardiffnlp/twitter-roberta-base-sentiment-latest']
      sources: none
      player: none
    get-keywords:
      models: ['ml6team/keyphrase-extraction-bert']
      sources: none
      player: none
    extract-video-object-detection-features:
      models: none
      sources: none
      player: none
    extract-video-environment-features:
      models: none
      sources: none
      player: none
    extract-video-movement-features:
      models: none
      sources: none
      player: none
vlm:
  use_model_finetuned: False
  testing_path: data/testing/visual/genres
  clip_resolution: 360x640
  clip_duration_seconds: 300
  # batch_size: 6
  # epochs: 10
  max_num_frames: 50  # the amout of frames we want to read from the video during the clip duration set (e.g. if video has 300 frames, we are only getting 16 frames)
  device_type: cuda:0 # <device hardware accelerator>:<GPU index> (nvidia)
  device_debug: 1
llm:
  use_model_finetuned: False
  device_debug: 1
local:
  scripts:
    apis: none
    internal:
      ffmpeg:
        audio-codec: aac
        audio-bitrate: 128k
        video-codec: h264
        video-bitrate: 500k
    path: tools/local/scripts
  # sources:
  #   games:
  #   - name: metacritic
  #     is_enabled: True
  #   trends: none
  #   feedback:
  #     reviews: none
  #     comments: none
  #     scores: none
  cache:
    path: data/cache/ 
    ignore_warning: False # in case reload/reset the cache memory is called
# We can also force the fallback by disabling all of the entities type (model, source or player)
models:
  environment:
  - repository: ultralytics
    name: torch-hub-yolov5s
    is_local: False
    is_enabled: False
    confidence_threshold: 0.5
  movement:
  - repository: none
    name: none
    is_local: False
    is_enabled: False
    confidence_threshold: 0.5
  object:
  - repository: facebook
    name: detr-resnet-50
    is_local: False
    is_enabled: False
    confidence_threshold: 0.5
  - repository: openai
    name: clip-vit-base-patch32
    is_local: False
    is_enabled: True
    confidence_threshold: 0.5
  video_classification:
  - repository: pytorch
    name: x3d-xs
    is_local: False
    is_enabled: False
    confidence_threshold: 0.5
  conversation: # text generation/chatbots
  - repository: meta-llama
    name: Meta-Llama-3.1-8B-Instruct
    is_local: False
    is_enabled: False
    confidence_threshold: 0.5
  - repository: openai-community
    name: gpt2
    is_local: False
    is_enabled: True
    confidence_threshold: 0.5
  sentiment_analysis:
  - repository: cardiffnlp
    name: twitter-roberta-base-sentiment-latest
    is_local: False
    is_enabled: True
    confidence_threshold: 0.5
    max_length: 512 # max number of characters/tokens for roberta models. If it is above, it truncates the text
  summarization:
  - repository: google
    name: pegasus-xsum
    is_local: False
    is_enabled: False
    confidence_threshold: 0.5
    max_length: 512 # max number of characters/tokens for roberta models. If it is above, it truncates the text
    min_length: 20 # less than this, makes it harder for the model to get the context
  feature-extraction:
  - repository: ml6team
    name: keyphrase-extraction-bert
    is_local: False
    is_enabled: True
    confidence_threshold: 0.5
  question_answer:
  - repository: deepset
    name: roberta-base-squad2
    is_local: False
    is_enabled: True
    confidence_threshold: 0.5
  translation: none
  hugging_face_token: YOUR_HUGGING_FACE_TOKEN
sources:
  external:
    apis:
    - publisher: google
      name: youtube
      token: YOUR_YOUTUBE_API_TOKEN
      video_published_before_days: 10
      max_number_attempts: 5
      is_simple_query: True
      is_enabled: True
    websites:
    - name: metacritic
      is_enabled: True
  internal:
    databases:
    - name: sqlite3
      is_enabled: False
      storage: sqlite_player_feedback.db
    path: data/database/
player:
  personality: ""  # Available: [happy, sad, frustrated, optimistic]
  age_group: ""  # Available: [young > teen > adult > old]
  location: ""  # Available: [Region > Country > Continent]
  gender: ""  # Available: [female, male]