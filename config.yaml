main:
  file_game: game1.mp4
  bot:
    personality: ""  # Available: [happy, sad, frustrated, optimistic]
    age_group: ""  # Available: [young > teen > adult > old]
    location: ""  # Available: [Region > Country > Continent]
    gender: ""  # Available: [female, male]
vlm: 
  models:
    environment:
    - repository: ultralytics
      name: torch-hub-yolov5s
      is_local: False
      is_enabled: False
    movement:
    - repository: none
      name: none
      is_local: False
      is_enabled: False
    object:
    - repository: facebook
      name: detr-resnet-50
      is_local: False
      is_enabled: False
      confidence_threshold: 0.5
    - repository: openai
      name: clip-vit-base-patch32
      is_local: False
      is_enabled: True
      confidence_threshold: 0.5
    video_classification:
    - repository: pytorch
      name: x3d-xs
      is_local: False
      is_enabled: False
  use_model_finetuned: False
  testing_path: data/testing/visual/genres
  clip_resolution: 360x640
  clip_duration_seconds: 300
  # batch_size: 6
  # epochs: 10
  max_num_frames: 50  # the amout of frames we want to read from the video during the clip duration set (e.g. if video has 300 frames, we are only getting 16 frames)
  device_type: cuda:0 # <device hardware accelerator>:<GPU index> (nvidia)
  device_debug: 1
llm:
  models:
    conversation: # text generation/chatbots
    - repository: None
      name: llama3.2
      is_local: False
      is_enabled: True
    question_answer:
    - repository: deepset
      name: roberta-base-squad2
      is_local: False
      is_enabled: True
  use_model_finetuned: False
  device_debug: 1
local:
  ffmpeg:
    audio-codec: aac
    audio-bitrate: 128k
    video-codec: h264
    video-bitrate: 500k
apis:
  hugging_face:
    token: YOUR_HUGGING_FACE_TOKEN
  google:
    youtube-key: YOUR_YOUTUBE_API_TOKEN
    video_published_before_days: 10
    max_number_attempts: 5
    is_simple_query: True
